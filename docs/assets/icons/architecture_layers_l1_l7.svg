  <text x="95" y="93" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">L7</text>
  <text x="95" y="108" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">UI / CLI</text>
  <text x="165" y="92" font-family="sans-serif" font-size="11" fill="#1e293b" font-weight="bold">Interface &amp; Apresentação Científica Multimodal</text>
  <text x="165" y="108" font-family="sans-serif" font-size="9" fill="#64748b">Modos: Usuário (Operacional) | Engenheiro (Componentes) | Cientista (Proveniência &amp; Conflitos)</text>

  <!-- Layer 6 -->
  <rect x="40" y="130" width="620" height="50" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
  <rect x="40" y="130" width="110" height="50" rx="6" fill="#6366f1"/>
  <text x="95" y="153" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">L6</text>
  <text x="95" y="168" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">APPLICATION</text>
  <text x="165" y="152" font-family="sans-serif" font-size="11" fill="#1e293b" font-weight="bold">Orquestração Científica &amp; Exploração Epistêmica</text>
  <text x="165" y="168" font-family="sans-serif" font-size="9" fill="#64748b">ExplorationService | ReproductionPipeline | FalsificationPipeline | DiscriminatoryDesign</text>

  <!-- Layer 5 -->
  <rect x="40" y="190" width="620" height="50" rx="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
