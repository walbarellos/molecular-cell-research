<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="firewallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="460" y="32" font-family="sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">
    SCIENTIFIC SYSTEMS EXPLORATION PLATFORM (SSEP) - ARQUITETURA L1 A L7
  </text>
  <text x="460" y="52" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Estrutura de 7 Camadas com Pilar Transversal de Integridade Epistêmica e Rastreabilidade Criptográfica
  </text>

  <!-- Left: 7 Layers Stack (x: 40, width: 620) -->
  <!-- Layer 7 -->
  <rect x="40" y="70" width="620" height="50" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
