  <text x="780" y="259" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Toda Claim exige evidências</text>
  <text x="780" y="271" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">e condições auditadas</text>
  <text x="780" y="283" font-family="sans-serif" font-size="8" fill="#047857" font-weight="bold" text-anchor="middle">(INV-CLAIM-001)</text>

  <rect x="695" y="310" width="170" height="70" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="328" font-family="sans-serif" font-size="10" fill="#b91c1c" font-weight="bold" text-anchor="middle">DETERMINISMO REPRO</text>
  <text x="780" y="344" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Execuções estocásticas</text>
  <text x="780" y="356" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">exigem semente e hash</text>
  <text x="780" y="368" font-family="sans-serif" font-size="8" fill="#047857" font-weight="bold" text-anchor="middle">(INV-REPRO-001)</text>

  <rect x="695" y="395" width="170" height="70" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="413" font-family="sans-serif" font-size="10" fill="#b91c1c" font-weight="bold" text-anchor="middle">CONHECIMENTO NEGATIVO</text>
  <text x="780" y="429" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Falhas geram ConflictRecord</text>
  <text x="780" y="441" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">e orientam novo design</text>
  <text x="780" y="453" font-family="sans-serif" font-size="8" fill="#047857" font-weight="bold" text-anchor="middle">(INV-CONFLICT-001)</text>

  <!-- Horizontal inspection lines from firewall to all layers -->
