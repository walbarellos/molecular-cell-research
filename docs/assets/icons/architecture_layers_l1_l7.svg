  <line x1="660" y1="155" x2="680" y2="155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="215" x2="680" y2="215" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="275" x2="680" y2="275" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="335" x2="680" y2="335" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="395" x2="680" y2="395" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="455" x2="680" y2="455" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
