  <rect x="695" y="140" width="170" height="70" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="158" font-family="sans-serif" font-size="10" fill="#b91c1c" font-weight="bold" text-anchor="middle">EPISTEMIC FIREWALL</text>
  <text x="780" y="174" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Proíbe contaminação de</text>
  <text x="780" y="186" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">EVIDENCE com GENERATED</text>
  <text x="780" y="198" font-family="sans-serif" font-size="8" fill="#047857" font-weight="bold" text-anchor="middle">(INV-DATA-001)</text>

  <rect x="695" y="225" width="170" height="70" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
