  <text x="95" y="228" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">COMPUTATION</text>
  <text x="165" y="212" font-family="sans-serif" font-size="11" fill="#1e293b" font-weight="bold">Motores Numéricos &amp; Modelos Biofísicos</text>
