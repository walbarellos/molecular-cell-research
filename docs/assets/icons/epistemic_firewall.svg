<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <linearGradient id="empGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Empirical Domain Box (Left) -->
  <rect x="30" y="30" width="260" height="180" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="30" y="30" width="260" height="35" rx="8" fill="url(#empGrad)"/>
  <text x="160" y="53" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">DOMINIO EMPIRICO [RAW]</text>
  <text x="45" y="90" font-family="sans-serif" font-size="11" fill="#065f46" font-weight="bold">• Observacoes Experimentais Fisicas</text>
  <text x="45" y="115" font-family="sans-serif" font-size="11" fill="#065f46">• Proveniencia Criptografica SHA-256</text>
  <text x="45" y="140" font-family="sans-serif" font-size="11" fill="#065f46">• Incertezas Aferidas (±σ, SE)</text>
  <text x="45" y="165" font-family="sans-serif" font-size="11" fill="#065f46">• Condicoes de Contorno Fixadas</text>
  <text x="45" y="190" font-family="sans-serif" font-size="10" fill="#047857" font-style="italic">Status: [OBSERVED | REPORTED]</text>

  <!-- Epistemic Firewall Barrier (Center) -->
  <line x1="350" y1="20" x2="350" y2="220" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="350" cy="120" r="28" fill="url(#shieldGrad)" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M 342 110 L 350 102 L 358 110 L 358 126 C 358 132 350 138 350 138 C 350 138 342 132 342 126 Z" fill="#ffffff"/>
  <text x="350" y="165" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="middle">FIREWALL</text>
  <text x="350" y="178" font-family="sans-serif" font-size="9" fill="#dc2626" font-weight="bold" text-anchor="middle">EPISTEMICO</text>

  <!-- Computational Domain Box (Right) -->
  <rect x="410" y="30" width="260" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="410" y="30" width="260" height="35" rx="8" fill="url(#compGrad)"/>
  <text x="540" y="53" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">COMPUTACAO [GENERATED]</text>
  <text x="425" y="90" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="bold">• Modelos Mecanomoleculares (M1, M2)</text>
  <text x="425" y="115" font-family="sans-serif" font-size="11" fill="#1e40af">• Simulacoes Deterministicas e Gillespie</text>
  <text x="425" y="140" font-family="sans-serif" font-size="11" fill="#1e40af">• Predicoes com Incerteza Propagada</text>
  <text x="425" y="165" font-family="sans-serif" font-size="11" fill="#1e40af">• Falsificacao e Testes de Residuos</text>
  <text x="425" y="190" font-family="sans-serif" font-size="10" fill="#1d4ed8" font-style="italic">Status: [MODELED | PREDICTED]</text>
</svg>
